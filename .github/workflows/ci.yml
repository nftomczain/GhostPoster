name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint-and-test:
    name: Lint + testy (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Ustaw Pythona
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Qt runtime (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libxkbcommon0 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-keysyms1 \
            libxcb-render-util0 \
            libxcb-xinerama0

      - name: Zainstaluj zaleznosci
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[gui,dev]"

      - name: ruff (lint)
        run: ruff check .

      - name: black (format check)
        run: black --check .

      - name: pytest
        run: pytest -q

  build:
    name: Budowa paczki (sdist + wheel)
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - uses: actions/checkout@v4

      - name: Ustaw Pythona
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Zainstaluj build
        run: |
          python -m pip install --upgrade pip build

      - name: Zbuduj paczke
        run: python -m build

      - name: Wgraj artefakty
        uses: actions/upload-artifact@v4
        with:
          name: ghostposter-dist
          path: dist/*

  build-windows-portable:
    name: Budowa przenośnej wersji Windows (.exe)
    runs-on: windows-latest
    needs: lint-and-test

    steps:
      - uses: actions/checkout@v4

      - name: Ustaw Pythona
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Zainstaluj zaleznosci
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[gui,build]"

      - name: Zbuduj GhostPoster.exe (PyInstaller)
        run: pyinstaller ghostposter.spec --noconfirm

      - name: Spakuj do zip
        run: Compress-Archive -Path dist/GhostPoster -DestinationPath GhostPoster-windows-portable.zip

      - name: Wgraj artefakt
        uses: actions/upload-artifact@v4
        with:
          name: GhostPoster-windows-portable
          path: GhostPoster-windows-portable.zip

  build-linux-appimage:
    name: Budowa AppImage (Linux)
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - uses: actions/checkout@v4

      - name: Ustaw Pythona
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Zainstaluj zaleznosci systemowe (Qt headless)
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0

      - name: Zbuduj AppImage
        run: ./scripts/build_appimage.sh

      - name: Wgraj artefakt
        uses: actions/upload-artifact@v4
        with:
          name: GhostPoster-x86_64-AppImage
          path: GhostPoster-x86_64.AppImage
