name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint-and-test:
    name: Lint + testy (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Ustaw Pythona
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Zainstaluj zaleznosci
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[gui,dev]"

      - name: ruff (lint)
        run: ruff check .

      - name: black (format check)
        run: black --check .

      - name: pytest
        run: pytest -q

  build:
    name: Budowa paczki (sdist + wheel)
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Ustaw Pythona
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Zainstaluj build
        run: python -m pip install --upgrade pip build

      - name: Zbuduj paczke
        run: python -m build

      - name: Wgraj artefakty
        uses: actions/upload-artifact@v4
        with:
          name: ghostposter-dist
          path: dist/*
